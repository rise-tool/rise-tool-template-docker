#
# Docker Compose 配置
#
services:
  rise-tool-template-docker:
    #
    # 镜像构建
    #
    build:
      context: .
      dockerfile: Dockerfile
    image: rise-tool-template-docker:v1.0.0
    #
    # 重启策略
    #
    restart: no
    #
    # 环境变量
    #
    #environment:
    #
    # 网络设置
    #
    network_mode: host
    #ports:
    #
    # 存储挂载
    #
    volumes:
      - type: bind
        source: ./volumes/test1
        target: /workspace/test1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./volumes/test2
        target: /workspace/test2
        read_only: true
        bind:
          create_host_path: false
