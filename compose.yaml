#
# Docker Compose 配置
#
services:
  test:
    #
    # ====================== 1. 构建标识相关 ======================
    #
    # 配置镜像构建
    build:
      context: .
      dockerfile: Dockerfile
    # 配置镜像名称
    image: test:v1
    # 配置容器名称
    container_name: test
    #
    # ====================== 2. 存储挂载相关 ======================
    #
    # 挂载数据卷
    volumes:
      - type: bind
        source: ./volumes/test1
        target: /workspace/test1
        bind:
          create_host_path: false
      - type: bind
        source: ./volumes/test2
        target: /workspace/test2
        bind:
          create_host_path: false
    #
    # ====================== 3. 终端输入相关 ======================
    #
    # 分配虚拟终端（TTY），等价于 `docker run -t`
    tty: true
    # 保持标准输入 stdin 打开，等价于 `docker run -i`
    stdin_open: true
    #
    # ====================== 4. 启动命令相关 ======================
    #
    # 容器启动后执行的默认程序，等价 docker run 末尾的 `/bin/bash`
    command: /bin/bash
    #
    # ====================== 5. 权限配置相关 ======================
    #
    # 开启特权模式（等价于 docker run --privileged）
    privileged: false
    #
    # ====================== 6. 重启策略相关 ======================
    #
    # 容器重启策略：`no`，容器退出永远不会自动重启
    restart: no
