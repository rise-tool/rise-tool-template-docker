#
# Docker Compose 配置
#
services:
  rise-tool-template-docker:
    #
    # 镜像构建
    #
    build:
      context: .
      dockerfile: Dockerfile
    image: rise-tool-template-docker:v1.0.0

    #
    # 容器名称
    #
    container_name: ${CONTAINER_NAME}

    #
    # 重启策略
    #
    restart: no

    #
    # 网络设置
    #
    network_mode: host
    # ports:

    #
    # 存储挂载
    #
    volumes:
      - type: bind
        source: ${VOLUMES_TEST_PATH}
        target: /workspace/test
        read_only: true
        bind:
          create_host_path: false
